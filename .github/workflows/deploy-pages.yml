name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish BudgetingApp.Web/BudgetingApp.Web.csproj -c Release -o publish

      # GitHub Pages serves this repo at /BudgetingApp/, not /, so both the app's <base href>
      # and the service worker's own base-path constant (which it uses to resolve every
      # cached asset URL) need rewriting in the published output only — source stays "/"
      # for local dev.
      - name: Fix base path for the /BudgetingApp/ subpath
        run: |
          sed -i 's#<base href="/" />#<base href="/BudgetingApp/" />#' publish/wwwroot/index.html
          sed -i 's#const base = "/";#const base = "/BudgetingApp/";#' publish/wwwroot/service-worker.js

      # The service worker fetches every cached asset with a Subresource-Integrity hash
      # taken from service-worker-assets.js, which the SDK computed at publish time —
      # before the base-href edit above changed index.html's bytes. Left alone, that stale
      # hash makes the browser reject the fetch, which fails the *entire* install step (one
      # bad hash aborts cache.addAll for every asset), so the app silently never installs
      # offline. Recompute and patch in the real hash for the edited file.
      - name: Fix stale integrity hash for the edited index.html
        run: |
          python3 - <<'PY'
          import hashlib, base64, re

          with open('publish/wwwroot/index.html', 'rb') as f:
              new_hash = 'sha256-' + base64.b64encode(hashlib.sha256(f.read()).digest()).decode()

          path = 'publish/wwwroot/service-worker-assets.js'
          with open(path, encoding='utf-8') as f:
              text = f.read()

          pattern = re.compile(r'("hash":\s*")[^"]*(",\s*\n\s*"url":\s*"index\.html")')
          text, count = pattern.subn(r'\g<1>' + new_hash + r'\g<2>', text)
          if count != 1:
              raise SystemExit(f'expected exactly 1 index.html manifest entry, found {count}')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(text)
          PY

      # Without this, GitHub Pages runs the output through Jekyll, which ignores any
      # directory starting with an underscore — silently dropping the entire _framework
      # folder that the WASM runtime and app DLL live in.
      - name: Disable Jekyll processing
        run: touch publish/wwwroot/.nojekyll

      # GitHub Pages has no server-side rewrites, so a direct/refreshed load of a client
      # route like /transactions 404s. Serving index.html as 404.html lets Blazor's own
      # router take over and resolve the route client-side instead.
      - name: Add SPA fallback for client-side routing
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - uses: actions/deploy-pages@v4
        id: deployment
